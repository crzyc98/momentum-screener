[project]
name = "momentum-screener"
version = "0.1.0"
description = "Rules-based monthly momentum sleeve screener, backtester, and dashboard (Porterhouse-style)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "plotly>=5.18",
    "streamlit>=1.30",
    "tabulate>=0.9",
    "xlrd>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
momentum = "momentum.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
